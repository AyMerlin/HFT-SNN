# E1: baseline replication — paper SNN, three strategies + naive versions, W_snn = 1,
# 100 aggTrades per vwap bar (base.yaml, decision U8).
# Hyperparameters tuned on the validation period (trial t018 of 80): experiments/configs/tuned/paper_snn.yaml.
inherits: base.yaml
name: e1_paper_baseline
description: Paper double-input SNN with pairwise STDP (Gao, Luk, Weston 2021), walk-forward 1 day.

models:
  - model: paper_snn
    name: paper
    input: {new_mean: 0.05}
    zscore: {new_std: 0.2}
    core:
      lif: {threshold: 4.0, leak: 0.2}
      stdp: {A: 0.01, B: -0.0105}   # STDP scale 1

backtest:
  split: test
  w_snn: [1]
  latencies_ms: [0, 10, 100, 1000]   # 0 = paper's next-bar entry (U2)
