# Head-to-head: the paper's strategies driven by the paper SNN (E1 settings) and by the improved
# model (E2 settings), each tuned on the validation period (experiments/configs/tuned/*.yaml).
inherits: base.yaml
name: head_to_head
description: Strategy backtests with the paper SNN and with the improved model, both
  tuned on validation, identical test days and seeds.
models:
- name: paper
  model: paper_snn
  input:
    ticks_per_bar: 10
    new_mean: 0.05
  zscore:
    new_std: 0.2
    stats_source: train_window
  core:
    hidden_size: 64
    lif:
      u_rest: 0.0
      threshold: 4.0
      leak: 0.2
      leak_mode: subtractive
      tau_m: 20.0
      t_ref: 2
    synapse:
      delay_ticks: 1
      w_init_low: 0.2
      w_init_high: 0.6
      w_max: 1.0
    stdp:
      A: 0.01
      B: -0.0105
      tau_plus: 5.0
      tau_minus: 5.0
      pairing: all_to_all
    warm_start: false
    epochs: 1
    learn_during_test: false
    reset_state_per_day: true
- name: improved
  model: hawkes_rstdp
  input:
    ticks_per_bar: 10
    new_mean: 0.3
  core:
    hidden_size: 64
    lif:
      u_rest: 0.0
      threshold: 32.0
      leak: 0.1
      leak_mode: subtractive
      tau_m: 20.0
      t_ref: 2
    synapse:
      delay_ticks: 1
      w_init_low: 0.2
      w_init_high: 0.6
      w_max: 1.0
    stdp:
      A: 0.005
      B: -0.00525
      tau_plus: 5.0
      tau_minus: 5.0
      pairing: all_to_all
    warm_start: false
    epochs: 1
    learn_during_test: false
    reset_state_per_day: true
  hawkes:
    time_axis: bar_index
    mark_fn: linear_normalized
    limit: right
    restarts: 5
    beta_init_grid:
    - 0.1
    - 0.5
    - 1.0
    - 2.0
    max_iter: 500
    event_quantile: 0.95
  rstdp:
    gamma: 0.1
    tau_z_bars: 1.0
    reset_eligibility_on_reward: false
    delivery: bar_end
  use_rstdp_pools: true
  keep_direction_pools: true
backtest:
  split: test
  w_snn:
  - 1
  w_h:
  - 1
  latencies_ms:
  - 0
  - 10
  - 100
  - 1000
