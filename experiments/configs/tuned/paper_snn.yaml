# Tuned on the validation period: 2025-10-17..2025-11-30, seeds [0, 1],
# 40 trials (grid seed 0); best trial t009: validation accuracy 0.5461 (chance 0.5245).
name: paper
model: paper_snn
input:
  ticks_per_bar: 10
  new_mean: 0.1
zscore:
  new_std: 0.1
  stats_source: train_window
core:
  hidden_size: 64
  lif:
    u_rest: 0.0
    threshold: 4.0
    leak: 0.1
    leak_mode: subtractive
    tau_m: 20.0
    t_ref: 2
  synapse:
    delay_ticks: 1
    w_init_low: 0.2
    w_init_high: 0.6
    w_max: 1.0
  stdp:
    A: 0.02
    B: -0.021
    tau_plus: 5.0
    tau_minus: 5.0
    pairing: all_to_all
  warm_start: false
  epochs: 1
  learn_during_test: false
  reset_state_per_day: true
