# Tuned on the validation period: 2025-10-17..2025-11-30, seeds [0, 1],
# 80 trials (grid seed 0); best trial t076: validation accuracy 0.5568 (chance 0.5011).
name: improved
model: hawkes_rstdp
input:
  ticks_per_bar: 10
  new_mean: 0.3
core:
  hidden_size: 64
  lif:
    u_rest: 0.0
    threshold: 32.0
    leak: 0.1
    leak_mode: subtractive
    tau_m: 20.0
    t_ref: 2
  synapse:
    delay_ticks: 1
    w_init_low: 0.2
    w_init_high: 0.6
    w_max: 1.0
  stdp:
    A: 0.005
    B: -0.00525
    tau_plus: 5.0
    tau_minus: 5.0
    pairing: all_to_all
  warm_start: false
  epochs: 1
  learn_during_test: false
  reset_state_per_day: true
hawkes:
  time_axis: bar_index
  mark_fn: linear_normalized
  limit: right
  restarts: 5
  beta_init_grid:
  - 0.1
  - 0.5
  - 1.0
  - 2.0
  max_iter: 500
  event_quantile: 0.95
rstdp:
  gamma: 0.1
  tau_z_bars: 1.0
  reset_eligibility_on_reward: false
  delivery: bar_end
use_rstdp_pools: true
keep_direction_pools: true
